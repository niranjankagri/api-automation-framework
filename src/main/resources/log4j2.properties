# Log4j2 configuration, loaded automatically from the classpath.
# Every message goes to the console and to applog.txt in the project root.

# Only report Log4j's own problems (not its startup details)
status = warn

# Console output
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-7p %d [%t] %c - %m%n

# File output: applog.txt, new runs are appended to the end
appender.file.type = File
appender.file.name = File
appender.file.fileName = applog.txt
appender.file.append = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %-7p %d [%t] %c - %m%n

# INFO and above go to both outputs
rootLogger.level = info
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File
