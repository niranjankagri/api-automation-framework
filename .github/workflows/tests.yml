# Runs the API tests on every push and pull request to main, and on demand.
# Uses ci-testng.xml: the full suite without the three report-demo tests (group "demo": passTest,
# and failTest and skipTest, which fail and skip on purpose), so a green build means every real test passed.
# The Extent report, the custom emailable report, the Allure results and the log are kept as an artifact.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, without a code change: a broken dependency or a change outside the repository
    # shows up within a week (night in India, before the daily Quality Intelligence collection)
    - cron: '30 22 * * 1'   # Monday 22:30 UTC
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: API tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # reuses downloaded dependencies between runs (keyed on pom.xml)

      - name: Run the tests
        run: mvn -B clean test -DsuiteXmlFile=ci-testng.xml

      # Kept even when tests fail, so failures can be analysed
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test-output/STMExtentReport.html
            target/surefire-reports/custom-emailable-report.html
            allure-results/
            applog.txt
          if-no-files-found: ignore
