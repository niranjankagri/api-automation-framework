# Runs the API tests on every push and pull request to main, and on demand.
# Uses ci-testng.xml: the full suite without the two report-demo tests that fail and skip
# on purpose, so a green build means every real test passed.
# The Extent report, the custom emailable report and the log are kept as an artifact.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows a manual run from the Actions tab
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: API tests (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # reuses downloaded dependencies between runs (keyed on pom.xml)

      - name: Run the tests
        run: mvn -B clean test -DsuiteXmlFile=ci-testng.xml

      # Kept even when tests fail, so failures can be analysed
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            test-output/STMExtentReport.html
            target/surefire-reports/custom-emailable-report.html
            allure-results/
            applog.txt
          if-no-files-found: ignore
